<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>ZainTechMart | Admin Panel</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 30px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aab4c8;
      margin-bottom: 25px;
    }

    .card {
      background: #151f33;
      border: 1px solid #263550;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #35445f;
      font-size: 15px;
    }

    input,
    textarea {
      background: #0d1628;
      color: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .danger {
      background: #dc2626;
    }

    .secondary {
      background: #475569;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #1e293b;
      color: #dbeafe;
    }

    .product {
      background: #0d1628;
      border: 1px solid #263550;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
    }

    .product h3 {
      margin-bottom: 7px;
    }

    .product p {
      color: #b8c2d6;
      margin: 5px 0;
    }

    .product-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .product-actions button {
      margin: 0;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #60a5fa;
    }

    label {
      display: block;
      margin-top: 8px;
      color: #dbe4f3;
      font-weight: bold;
    }
  </style></head><body>  <div class="container"><!-- LOGIN -->
<div id="loginSection" class="card">
  <h1>ZainTechMart Admin</h1>
  <p class="subtitle">Admin login</p>

  <div id="loginMessage" class="message hidden"></div>

  <label>Email</label>
  <input
    type="email"
    id="loginEmail"
    placeholder="Admin email"
    autocomplete="email"
  >

  <label>Password</label>
  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button onclick="login()">Login</button>
</div>


<!-- ADMIN PANEL -->
<div id="adminSection" class="hidden">

  <div class="card">
    <h1>ZainTechMart Admin Panel</h1>
    <p class="subtitle">Manage your products</p>

    <button class="secondary" onclick="logout()">Logout</button>
  </div>


  <!-- ADD / EDIT PRODUCT -->
  <div class="card">

    <h2 id="formTitle">Add Product</h2>

    <input type="hidden" id="productId">

    <label>Product Name</label>
    <input
      type="text"
      id="productName"
      placeholder="Example: Air31 Earbuds"
    >

    <label>Price</label>
    <input
      type="number"
      id="productPrice"
      placeholder="Example: 3500"
      min="0"
      step="0.01"
    >

    <label>Image File Name</label>
    <input
      type="text"
      id="productImage"
      placeholder="Example: air31-earbuds.jpeg"
    >

    <label>Features / Description</label>
    <textarea
      id="productDescription"
      placeholder="Write product features..."
    ></textarea>

    <button onclick="saveProduct()">Save Product</button>

    <button
      id="cancelEditButton"
      class="secondary hidden"
      onclick="cancelEdit()"
    >
      Cancel Edit
    </button>

  </div>


  <!-- PRODUCTS -->
  <div class="card">

    <h2>Your Products</h2>

    <div id="productsMessage" class="message">
      Loading products...
    </div>

    <div id="productsList"></div>

  </div>

</div>

  </div>  <script>

    // ==============================
    // SUPABASE CONFIGURATION
    // ==============================

    const SUPABASE_URL =
      "https://lynpuyxriagxyglygdqf.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_XICT109xIvHO389cu0xi6w_uSKUbVbe";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // ==============================
    // LOGIN
    // ==============================

    async function login() {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const message =
        document.getElementById("loginMessage");

      message.classList.add("hidden");

      if (!email || !password) {
        showLoginMessage("Please enter email and password.");
        return;
      }

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        showLoginMessage(error.message);
        return;
      }

      showAdminPanel();
    }


    function showLoginMessage(text) {

      const message =
        document.getElementById("loginMessage");

      message.textContent = text;
      message.classList.remove("hidden");
    }


    // ==============================
    // LOGOUT
    // ==============================

    async function logout() {

      await supabaseClient.auth.signOut();

      document
        .getElementById("adminSection")
        .classList.add("hidden");

      document
        .getElementById("loginSection")
        .classList.remove("hidden");

      document.getElementById("loginPassword").value = "";
    }


    // ==============================
    // SHOW ADMIN PANEL
    // ==============================

    function showAdminPanel() {

      document
        .getElementById("loginSection")
        .classList.add("hidden");

      document
        .getElementById("adminSection")
        .classList.remove("hidden");

      loadProducts();
    }


    // ==============================
    // LOAD PRODUCTS
    // ==============================

    async function loadProducts() {

      const message =
        document.getElementById("productsMessage");

      const list =
        document.getElementById("productsList");

      message.classList.remove("hidden");
      message.textContent = "Loading products...";

      list.innerHTML = "";

      const { data, error } =
        await supabaseClient
          .from("products")
          .select("*")
          .order("created_at", { ascending: false });

      if (error) {

        message.textContent =
          "Could not load products: " + error.message;

        return;
      }

      if (!data || data.length === 0) {

        message.textContent =
          "No products found.";

        return;
      }

      message.classList.add("hidden");

      data.forEach(product => {

        const div =
          document.createElement("div");

        div.className = "product";

        div.innerHTML = `
          <h3>${escapeHtml(product.name || "")}</h3>

          <p class="price">
            Price: ${escapeHtml(String(product.price ?? ""))}
          </p>

          <p>
            Image:
            ${escapeHtml(product.image || "")}
          </p>

          <p>
            ${escapeHtml(product.description || "")}
          </p>

          <div class="product-actions">

            <button
              onclick="editProduct('${product.id}')"
            >
              Edit
            </button>

            <button
              class="danger"
              onclick="deleteProduct('${product.id}')"
            >
              Delete
            </button>

          </div>
        `;

        list.appendChild(div);

      });
    }


    // ==============================
    // SAVE PRODUCT
    // ==============================

    async function saveProduct() {

      const id =
        document.getElementById("productId").value;

      const name =
        document.getElementById("productName").value.trim();

      const price =
        document.getElementById("productPrice").value;

      const image =
        document.getElementById("productImage").value.trim();

      const description =
        document.getElementById("productDescription").value.trim();


      if (!name || !price) {

        alert("Product name and price are required.");

        return;
      }


      const productData = {
        name: name,
        price: Number(price),
        image: image,
        description: description
      };


      let result;


      if (id) {

        result =
          await supabaseClient
            .from("products")
            .update(productData)
            .eq("id", id);

      } else {

        result =
          await supabaseClient
            .from("products")
            .insert([productData]);

      }


      if (result.error) {

        alert(
          "Error saving product:\n\n" +
          result.error.message
        );

        return;
      }


      alert(
        id
          ? "Product updated successfully."
          : "Product added successfully."
      );


      clearForm();
      loadProducts();
    }


    // ==============================
    // EDIT PRODUCT
    // ==============================

    async function editProduct(id) {

      const { data, error } =
        await supabaseClient
          .from("products")
          .select("*")
          .eq("id", id)
          .single();


      if (error) {

        alert(
          "Could not load product:\n\n" +
          error.message
        );

        return;
      }


      document.getElementById("productId").value =
        data.id;

      document.getElementById("productName").value =
        data.name || "";

      document.getElementById("productPrice").value =
        data.price || "";

      document.getElementById("productImage").value =
        data.image || "";

      document.getElementById("productDescription").value =
        data.description || "";


      document.getElementById("formTitle").textContent =
        "Edit Product";

      document
        .getElementById("cancelEditButton")
        .classList.remove("hidden");


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    // ==============================
    // DELETE PRODUCT
    // ==============================

    async function deleteProduct(id) {

      const confirmed =
        confirm(
          "Are you sure you want to delete this product?"
        );


      if (!confirmed) {
        return;
      }


      const { error } =
        await supabaseClient
          .from("products")
          .delete()
          .eq("id", id);


      if (error) {

        alert(
          "Could not delete product:\n\n" +
          error.message
        );

        return;
      }


      alert("Product deleted successfully.");

      loadProducts();
    }


    // ==============================
    // CLEAR FORM
    // ==============================

    function clearForm() {

      document.getElementById("productId").value = "";
      document.getElementById("productName").value = "";
      document.getElementById("productPrice").value = "";
      document.getElementById("productImage").value = "";
      document.getElementById("productDescription").value = "";

      document.getElementById("formTitle").textContent =
        "Add Product";

      document
        .getElementById("cancelEditButton")
        .classList.add("hidden");
    }


    function cancelEdit() {
      clearForm();
    }


    // ==============================
    // HTML SAFETY
    // ==============================

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ==============================
    // CHECK EXISTING SESSION
    // ==============================

    async function checkSession() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session) {
        showAdminPanel();
      }
    }


    checkSession();

  </script></body>
  </html>
