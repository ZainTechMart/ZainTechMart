<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZainTechMart | Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 30px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    h2 {
      margin-bottom: 12px;
    }

    .subtitle {
      color: #aab4c8;
      margin-bottom: 25px;
    }

    .card {
      background: #151f33;
      border: 1px solid #263550;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #35445f;
      font-size: 15px;
    }

    input,
    textarea,
    select {
      background: #0d1628;
      color: white;
    }

    select {
      cursor: pointer;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .danger {
      background: #dc2626;
    }

    .secondary {
      background: #475569;
    }

    .success {
      background: #059669;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #1e293b;
      color: #dbeafe;
    }

    .product {
      background: #0d1628;
      border: 1px solid #263550;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
    }

    .product h3 {
      margin-bottom: 7px;
    }

    .product p {
      color: #b8c2d6;
      margin: 5px 0;
    }

    .product-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .product-actions button {
      margin: 0;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #60a5fa;
    }

    .category-badge {
      display: inline-block;
      background: #1d4ed8;
      color: white;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 5px;
    }

    label {
      display: block;
      margin-top: 8px;
      color: #dbe4f3;
      font-weight: bold;
    }

    .image-preview {
      width: 180px;
      max-width: 100%;
      border-radius: 10px;
      margin-top: 10px;
      border: 1px solid #35445f;
      display: none;
    }

    .product-image {
      width: 150px;
      max-width: 100%;
      border-radius: 10px;
      margin: 10px 0;
      display: block;
    }

    .upload-status {
      color: #93c5fd;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .category-item {
      background: #0d1628;
      border: 1px solid #263550;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .category-name {
      font-weight: bold;
      flex: 1;
    }

    .category-actions {
      display: flex;
      gap: 8px;
    }

    .category-actions button {
      width: auto;
      margin: 0;
      padding: 8px 12px;
    }

    .empty-text {
      color: #94a3b8;
      margin-top: 10px;
    }

    @media (max-width: 600px) {

      .container {
        width: 94%;
        margin: 20px auto;
      }

      .card {
        padding: 16px;
      }

      .category-item {
        align-items: flex-start;
      }

      .category-actions {
        flex-direction: column;
      }

      .category-actions button {
        width: 100%;
      }

      .product-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card">

    <h1>ZainTechMart Admin</h1>

    <p class="subtitle">
      Admin login
    </p>

    <div id="loginMessage" class="message hidden"></div>

    <label>Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin email"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">
      Login
    </button>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminSection" class="hidden">

    <div class="card">

      <h1>ZainTechMart Admin Panel</h1>

      <p class="subtitle">
        Manage your products and categories
      </p>

      <button
        class="secondary"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- CATEGORY MANAGEMENT -->
    <div class="card">

      <h2>
        Categories
      </h2>

      <p class="subtitle">
        Create and manage your shop categories.
      </p>

      <input
        type="text"
        id="newCategoryName"
        placeholder="Example: Smart Watches"
      >

      <button
        class="success"
        onclick="createCategory()"
      >
        Create New Category
      </button>

      <div
        id="categoryMessage"
        class="message hidden"
      ></div>

      <div id="categoriesList"></div>

    </div>


    <!-- ADD / EDIT PRODUCT -->
    <div class="card">

      <h2 id="formTitle">
        Add Product
      </h2>

      <input
        type="hidden"
        id="productId"
      >


      <label>
        Product Name
      </label>

      <input
        type="text"
        id="productName"
        placeholder="Example: Air31 Earbuds"
      >


      <label>
        Price
      </label>

      <input
        type="number"
        id="productPrice"
        placeholder="Example: 3500"
        min="0"
        step="0.01"
      >


      <!-- CATEGORY -->
      <label>
        Category
      </label>

      <select id="productCategory">

        <option value="">
          Select Category
        </option>

      </select>


      <label>
        Product Image
      </label>

      <input
        type="file"
        id="productImageFile"
        accept="image/*"
        onchange="previewImage(event)"
      >

      <p
        id="uploadStatus"
        class="upload-status"
      ></p>

      <img
        id="imagePreview"
        class="image-preview"
        alt="Image preview"
      >


      <label>
        Features / Description
      </label>

      <textarea
        id="productDescription"
        placeholder="Write product features..."
      ></textarea>


      <button onclick="saveProduct()">
        Save Product
      </button>


      <button
        id="cancelEditButton"
        class="secondary hidden"
        onclick="cancelEdit()"
      >
        Cancel Edit
      </button>

    </div>


    <!-- PRODUCTS -->
    <div class="card">

      <h2>
        Your Products
      </h2>

      <div
        id="productsMessage"
        class="message"
      >
        Loading products...
      </div>

      <div id="productsList"></div>

    </div>

  </div>

</div>


<script>

  // ==============================
  // SUPABASE CONFIGURATION
  // ==============================

  const SUPABASE_URL =
    "https://lynpuyxriagxyglygdqf.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_XICT109xIvHO389cu0xi6w_uSKUbVbe";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ==============================
  // LOGIN
  // ==============================

  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("loginMessage");

    message.classList.add("hidden");

    if (!email || !password) {

      showLoginMessage(
        "Please enter email and password."
      );

      return;
    }

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showLoginMessage(
        error.message
      );

      return;
    }

    showAdminPanel();
  }


  function showLoginMessage(text) {

    const message =
      document.getElementById("loginMessage");

    message.textContent = text;

    message.classList.remove("hidden");
  }


  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminSection")
      .classList.add("hidden");

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    document
      .getElementById("loginPassword")
      .value = "";
  }


  // ==============================
  // SHOW ADMIN PANEL
  // ==============================

  async function showAdminPanel() {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminSection")
      .classList.remove("hidden");

    await loadCategories();
    await loadProducts();
  }


  // ==============================
  // CREATE SLUG
  // ==============================

  function createSlug(name) {

    return name
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }


  // ==============================
  // CREATE CATEGORY
  // ==============================

  async function createCategory() {

    const input =
      document.getElementById("newCategoryName");

    const name =
      input.value.trim();

    if (!name) {

      alert(
        "Please enter a category name."
      );

      return;
    }

    const slug =
      createSlug(name);

    if (!slug) {

      alert(
        "Please enter a valid category name."
      );

      return;
    }

    const { error } =
      await supabaseClient
        .from("categories")
        .insert([
          {
            name: name,
            slug: slug
          }
        ]);

    if (error) {

      if (error.code === "23505") {

        alert(
          "This category already exists."
        );

      } else {

        alert(
          "Could not create category:\n\n" +
          error.message
        );
      }

      return;
    }

    input.value = "";

    showCategoryMessage(
      "Category created successfully."
    );

    await loadCategories();
  }


  function showCategoryMessage(text) {

    const message =
      document.getElementById("categoryMessage");

    message.textContent = text;

    message.classList.remove("hidden");

    setTimeout(() => {

      message.classList.add("hidden");

    }, 3000);
  }


  // ==============================
  // LOAD CATEGORIES
  // ==============================

  async function loadCategories() {

    const { data, error } =
      await supabaseClient
        .from("categories")
        .select("*")
        .order("name", {
          ascending: true
        });

    if (error) {

      alert(
        "Could not load categories:\n\n" +
        error.message
      );

      return;
    }


    const list =
      document.getElementById("categoriesList");

    const select =
      document.getElementById("productCategory");


    list.innerHTML = "";

    select.innerHTML =
      '<option value="">Select Category</option>';


    if (!data || data.length === 0) {

      list.innerHTML =
        '<p class="empty-text">No categories created yet.</p>';

      return;
    }


    data.forEach(category => {

      // Dropdown option

      const option =
        document.createElement("option");

      option.value =
        category.id;

      option.textContent =
        category.name;

      select.appendChild(option);


      // Category list item

      const item =
        document.createElement("div");

      item.className =
        "category-item";


      const name =
        document.createElement("div");

      name.className =
        "category-name";

      name.textContent =
        category.name;


      const actions =
        document.createElement("div");

      actions.className =
        "category-actions";


      const editButton =
        document.createElement("button");

      editButton.textContent =
        "Rename";

      editButton.onclick =
        function() {

          renameCategory(
            category.id,
            category.name
          );

        };


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent =
        "Delete";

      deleteButton.className =
        "danger";

      deleteButton.onclick =
        function() {

          deleteCategory(
            category.id,
            category.name
          );

        };


      actions.appendChild(
        editButton
      );

      actions.appendChild(
        deleteButton
      );


      item.appendChild(name);

      item.appendChild(actions);

      list.appendChild(item);

    });
  }


  // ==============================
  // RENAME CATEGORY
  // ==============================

  async function renameCategory(id, oldName) {

    const newName =
      prompt(
        "Enter new category name:",
        oldName
      );

    if (newName === null) {
      return;
    }

    const name =
      newName.trim();

    if (!name) {

      alert(
        "Category name cannot be empty."
      );

      return;
    }

    const slug =
      createSlug(name);

    const { error } =
      await supabaseClient
        .from("categories")
        .update({
          name: name,
          slug: slug
        })
        .eq("id", id);

    if (error) {

      if (error.code === "23505") {

        alert(
          "Another category with this name already exists."
        );

      } else {

        alert(
          "Could not rename category:\n\n" +
          error.message
        );
      }

      return;
    }

    await loadCategories();
    await loadProducts();

    alert(
      "Category renamed successfully."
    );
  }


  // ==============================
  // DELETE CATEGORY
  // ==============================

  async function deleteCategory(id, name) {

    const confirmed =
      confirm(
        "Delete category \"" +
        name +
        "\"?\n\nProducts in this category will become uncategorized."
      );

    if (!confirmed) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("categories")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Could not delete category:\n\n" +
        error.message
      );

      return;
    }


    await loadCategories();

    await loadProducts();


    alert(
      "Category deleted successfully."
    );
  }


  // ==============================
  // LOAD PRODUCTS
  // ==============================

  async function loadProducts() {

    const message =
      document.getElementById("productsMessage");

    const list =
      document.getElementById("productsList");

    message.classList.remove("hidden");

    message.textContent =
      "Loading products...";

    list.innerHTML = "";


    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      message.textContent =
        "Could not load products: " +
        error.message;

      return;
    }


    if (!data || data.length === 0) {

      message.textContent =
        "No products found.";

      return;
    }


    message.classList.add("hidden");


    // Load categories for displaying names

    const {
      data: categories
    } =
      await supabaseClient
        .from("categories")
        .select("id, name");


    const categoryMap = {};

    (categories || []).forEach(category => {

      categoryMap[category.id] =
        category.name;

    });


    data.forEach(product => {

      const div =
        document.createElement("div");

      div.className =
        "product";


      const title =
        document.createElement("h3");

      title.textContent =
        product.name || "";

      div.appendChild(title);


      const price =
        document.createElement("p");

      price.className =
        "price";

      price.textContent =
        "Price: " +
        (product.price ?? "");

      div.appendChild(price);


      if (product.category_id &&
          categoryMap[product.category_id]) {

        const category =
          document.createElement("span");

        category.className =
          "category-badge";

        category.textContent =
          categoryMap[product.category_id];

        div.appendChild(category);
      }


      if (product.image) {

        const image =
          document.createElement("img");

        image.className =
          "product-image";

        image.src =
          product.image;

        image.alt =
          product.name || "Product image";

        image.onerror = function() {

          this.style.display =
            "none";

        };

        div.appendChild(image);
      }


      const description =
        document.createElement("p");

      description.textContent =
        product.description || "";

      div.appendChild(description);


      const actions =
        document.createElement("div");

      actions.className =
        "product-actions";


      const editButton =
        document.createElement("button");

      editButton.textContent =
        "Edit";

      editButton.onclick =
        function() {

          editProduct(product.id);

        };


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent =
        "Delete";

      deleteButton.className =
        "danger";

      deleteButton.onclick =
        function() {

          deleteProduct(product.id);

        };


      actions.appendChild(editButton);

      actions.appendChild(deleteButton);

      div.appendChild(actions);

      list.appendChild(div);

    });
  }


  // ==============================
  // IMAGE PREVIEW
  // ==============================

  function previewImage(event) {

    const file =
      event.target.files[0];

    const preview =
      document.getElementById("imagePreview");

    const status =
      document.getElementById("uploadStatus");


    if (!file) {

      preview.style.display =
        "none";

      status.textContent =
        "";

      return;
    }


    if (!file.type.startsWith("image/")) {

      alert(
        "Please select an image file."
      );

      event.target.value =
        "";

      preview.style.display =
        "none";

      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        preview.src =
          e.target.result;

        preview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

    status.textContent =
      "Image selected: " +
      file.name;
  }


  // ==============================
  // UPLOAD IMAGE
  // ==============================

  async function uploadImage(file) {

    if (!file) {
      return null;
    }


    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 9) +
      "." +
      extension;


    const filePath =
      fileName;


    const { error } =
      await supabaseClient
        .storage
        .from("product-images")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (error) {

      throw error;
    }


    const { data } =
      supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(filePath);


    return data.publicUrl;
  }


  // ==============================
  // SAVE PRODUCT
  // ==============================

  async function saveProduct() {

    const id =
      document.getElementById("productId").value;

    const name =
      document
        .getElementById("productName")
        .value
        .trim();

    const price =
      document
        .getElementById("productPrice")
        .value;

    const categoryId =
      document
        .getElementById("productCategory")
        .value;

    const description =
      document
        .getElementById("productDescription")
        .value
        .trim();

    const imageFile =
      document
        .getElementById("productImageFile")
        .files[0];

    const status =
      document.getElementById("uploadStatus");


    if (!name || !price) {

      alert(
        "Product name and price are required."
      );

      return;
    }


    if (!categoryId) {

      alert(
        "Please select a category."
      );

      return;
    }


    try {

      status.textContent =
        "Saving product...";


      let imageUrl = null;


      // Upload new image if selected

      if (imageFile) {

        status.textContent =
          "Uploading image...";

        imageUrl =
          await uploadImage(imageFile);
      }


      const productData = {

        name: name,

        price: Number(price),

        category_id: Number(categoryId),

        description: description

      };


      // Only change image when
      // a new image was selected

      if (imageUrl) {

        productData.image =
          imageUrl;
      }


      let result;


      if (id) {

        result =
          await supabaseClient
            .from("products")
            .update(productData)
            .eq("id", id);

      } else {

        // New product needs an image

        if (!imageUrl) {

          alert(
            "Please select a product image."
          );

          status.textContent =
            "";

          return;
        }


        result =
          await supabaseClient
            .from("products")
            .insert([
              productData
            ]);
      }


      if (result.error) {

        alert(
          "Error saving product:\n\n" +
          result.error.message
        );

        status.textContent =
          "";

        return;
      }


      alert(
        id
          ? "Product updated successfully."
          : "Product added successfully."
      );


      clearForm();

      await loadProducts();

    } catch (error) {

      alert(
        "Image upload failed:\n\n" +
        error.message
      );

      status.textContent =
        "";
    }
  }


  // ==============================
  // EDIT PRODUCT
  // ==============================

  async function editProduct(id) {

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

      alert(
        "Could not load product:\n\n" +
        error.message
      );

      return;
    }


    document
      .getElementById("productId")
      .value =
      data.id;


    document
      .getElementById("productName")
      .value =
      data.name || "";


    document
      .getElementById("productPrice")
      .value =
      data.price || "";


    document
      .getElementById("productCategory")
      .value =
      data.category_id || "";


    document
      .getElementById("productDescription")
      .value =
      data.description || "";


    const preview =
      document.getElementById("imagePreview");


    if (data.image) {

      preview.src =
        data.image;

      preview.style.display =
        "block";

    } else {

      preview.style.display =
        "none";

    }


    document
      .getElementById("uploadStatus")
      .textContent =
      "Choose a new image only if you want to replace the current image.";


    document
      .getElementById("formTitle")
      .textContent =
      "Edit Product";


    document
      .getElementById("cancelEditButton")
      .classList
      .remove("hidden");


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  // ==============================
  // DELETE PRODUCT
  // ==============================

  async function deleteProduct(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );


    if (!confirmed) {
      return;
    }


    const { error } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Could not delete product:\n\n" +
        error.message
      );

      return;
    }


    alert(
      "Product deleted successfully."
    );


    loadProducts();
  }


  // ==============================
  // CLEAR FORM
  // ==============================

  function clearForm() {

    document
      .getElementById("productId")
      .value =
      "";


    document
      .getElementById("productName")
      .value =
      "";


    document
      .getElementById("productPrice")
      .value =
      "";


    document
      .getElementById("productCategory")
      .value =
      "";


    document
      .getElementById("productDescription")
      .value =
      "";


    document
      .getElementById("productImageFile")
      .value =
      "";


    document
      .getElementById("formTitle")
      .textContent =
      "Add Product";


    document
      .getElementById("cancelEditButton")
      .classList
      .add("hidden");


    document
      .getElementById("imagePreview")

  function cancelEdit() {

    clearForm();

  }


  // ==============================
  // CHECK EXISTING SESSION
  // ==============================

  async function checkSession() {

    const { data } =
      await supabaseClient
        .auth
        .getSession();


    if (data.session) {

      showAdminPanel();

    }

  }


  checkSession();

</script>
